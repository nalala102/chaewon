<script id="lumi-canvas-guard">
(function() {
  if (window.__lumiCanvasGuard) return;
  window.__lumiCanvasGuard = true;
  var MAX_PX = 4096, MIN_FONT_PX = 12;
  try {
    var CP = HTMLCanvasElement.prototype;
    var BOX = {width: 'clientWidth', height: 'clientHeight'}, D = {};
    Object.keys(BOX).forEach(function(p) {
      D[p] = Object.getOwnPropertyDescriptor(CP, p);
    });
    var tracking = function(el, p) {
      var box = el[BOX[p]];
      return !el.style[p] && box > 0 && box === D[p].get.call(el) &&
          box === el['__lumiLast' + p];
    };
    var MAX = {width: 'maxWidth', height: 'maxHeight'};
    var PAD = {width: ['paddingLeft', 'paddingRight'],
               height: ['paddingTop', 'paddingBottom']};
    var avail = function(el, p) {
      var pe = el.parentElement;
      if (!pe) return 0;
      var cs = getComputedStyle(pe);
      return pe[BOX[p]] - parseFloat(cs[PAD[p][0]]) -
          parseFloat(cs[PAD[p][1]]);
    };
    Object.keys(BOX).forEach(function(p) {
      var d = D[p];
      if (!d || !d.set || !d.get) return;
      Object.defineProperty(CP, p, {
        configurable: true, enumerable: d.enumerable, get: d.get,
        set: function(v) {
          var n = +v, box = this[BOX[p]];
          if (n > MAX_PX) n = MAX_PX;
          if (n > box && tracking(this, p)) {
            var el = this, pins = {};
            Object.keys(BOX).forEach(function(q) {
              if (tracking(el, q)) pins[q] = avail(el, q) ||
                  el['__lumiBox' + q];
            });
            Object.keys(pins).forEach(function(q) {
              el.style[q] = '100%';
              el.style[MAX[q]] = pins[q] + 'px';
            });
            n = box;
          }
          this['__lumiBox' + p] = box;
          this['__lumiLast' + p] = n;
          d.set.call(this, isNaN(n) ? v : n);
        }
      });
    });
  } catch (e) {}
  try {
    var XP = CanvasRenderingContext2D.prototype;
    var px = /(\d*\.?\d+)px/;
    var floorFont = function(ctx) {
      var f = ctx.font, m = px.exec(f);
      if (m && +m[1] >= 4 && +m[1] < MIN_FONT_PX) ctx.font = f.replace(px, MIN_FONT_PX + 'px');
    };
    ['fillText', 'strokeText', 'measureText'].forEach(function(k) {
      var o = XP[k];
      if (typeof o !== 'function') return;
      XP[k] = function() { floorFont(this); return o.apply(this, arguments); };
    });
  } catch (e) {}
})();
</script>

<style id="lumi-runtime">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>내 그림을 움직여봐요 - 무지개 바다</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Gamja+Flower&display=swap');

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      margin: 0;
      padding: 0;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: 'Gamja Flower', cursive, sans-serif;
    }

    .widget-container {
      position: relative;
      width: 100%;
      height: 100vh;
      overflow: hidden;
      background: linear-gradient(180deg, #a0c4ff 0%, #caffbf 35%, #ffffd1 65%, #ffc6ff 100%);
      background-size: 100% 200%;
      animation: oceanGlow 10s ease infinite alternate;
      display: flex;
      flex-direction: column;
    }

    @keyframes oceanGlow {
      0% { background-position: 0% 0%; }
      100% { background-position: 0% 100%; }
    }

    /* 상단 네비게이션 바 */
    .top-bar {
      position: relative;
      z-index: 20;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 16px;
      background: rgba(255, 255, 255, 0.4);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
    }

    /* 통일된 주황색 '홈으로' 버튼 */
    .home-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #ff924c;
      border: 2px solid #ff7020;
      border-radius: 999px;
      padding: 5px 14px;
      cursor: pointer;
      box-shadow: 0 3px 8px rgba(255, 112, 32, 0.3);
      transition: all 0.2s ease;
      text-decoration: none;
    }

    .home-btn:hover {
      transform: scale(1.05);
      background: #ff8030;
    }

    .home-icon-roof {
      width: 0;
      height: 0;
      border-left: 8px solid transparent;
      border-right: 8px solid transparent;
      border-bottom: 8px solid #ffffff;
      margin: 0 auto;
    }

    .home-icon-body {
      width: 12px;
      height: 8px;
      background: #ffffff;
      margin: -1px auto 0 auto;
      border-radius: 0 0 2px 2px;
    }

    .home-btn-text {
      font-size: 18px;
      font-weight: bold;
      color: #ffffff;
    }

    /* 우측 버튼 그룹 */
    .btn-group {
      display: flex;
      gap: 8px;
    }

    .btn-action {
      background: rgba(255, 255, 255, 0.9);
      border: 2px solid #ff99c8;
      border-radius: 999px;
      padding: 5px 14px;
      font-size: 17px;
      font-family: inherit;
      font-weight: bold;
      color: #333;
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(0,0,0,0.06);
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
    }

    .btn-action:hover {
      transform: scale(1.05);
      background: #ffffff;
    }

    #fileInput {
      display: none;
    }

    /* 바다 게임 영역 */
    .game-area {
      position: relative;
      flex: 1;
      z-index: 10;
      width: 100%;
      height: 100%;
    }

    #gameCanvas {
      width: 100%;
      height: 100%;
      display: block;
      cursor: pointer;
    }

    /* 팝업 효과 */
    .pop-effect {
      position: absolute;
      pointer-events: none;
      animation: popFade 0.6s forwards ease-out;
      font-size: 22px;
      font-weight: bold;
      color: #ff477e;
      z-index: 30;
      text-shadow: 0 2px 4px rgba(255,255,255,0.9);
    }

    @keyframes popFade {
      0% { opacity: 1; transform: scale(0.8) translateY(0); }
      100% { opacity: 0; transform: scale(1.5) translateY(-30px); }
    }
  </style>
</head>
<body>

<div class="widget-container">
  <!-- 상단 네비게이션 바 -->
  <div class="top-bar">
    <a href="index.html" class="home-btn">
      <div>
        <div class="home-icon-roof"></div>
        <div class="home-icon-body"></div>
      </div>
      <span class="home-btn-text">홈으로</span>
    </a>

    <div class="btn-group">
      <label for="fileInput" class="btn-action">
        📷 그림 올리기
      </label>
      <input type="file" id="fileInput" accept="image/*">
      <button class="btn-action" id="resetBtn">🔄 초기화</button>
    </div>
  </div>

  <!-- 메인 무지개 바다 영역 -->
  <div class="game-area" id="gameArea">
    <canvas id="gameCanvas"></canvas>
  </div>
</div>

<script>
  (function() {
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const gameArea = document.getElementById('gameArea');
    const fileInput = document.getElementById('fileInput');
    const resetBtn = document.getElementById('resetBtn');

    const seaEmojis = ['🐙', '🦑', '🪼', '🦀', '🐠', '🐟', '🐡', '🐬', '🐳', '🦭', '⭐', '🐚'];
    
    // 도레미파솔라시도 2옥타브 음계
    const scaleNotes = [
      261.63, 293.66, 329.63, 349.23, 392.00, 440.00, 493.88,
      523.25, 587.33, 659.25, 698.46, 783.99, 880.00, 987.77, 1046.50
    ];

    let creatures = [];
    let customImages = [];
    let noteIndex = 0;

    function resizeCanvas() {
      canvas.width = gameArea.clientWidth;
      canvas.height = gameArea.clientHeight;
    }

    class SeaCreature {
      constructor(imgSrc = null) {
        this.imgSrc = imgSrc;
        this.reset(true);
      }

      reset(initial = false) {
        if (!this.imgSrc) {
          this.emoji = seaEmojis[Math.floor(Math.random() * seaEmojis.length)];
          this.isCustom = false;
        } else {
          this.img = new Image();
          this.img.src = this.imgSrc;
          this.isCustom = true;
        }

        // 기본 이모티콘은 아기자기하게 더 작게(22~32px), 아이 그림은 주인공답게 훨씬 크게(85~115px) 조정
        this.size = this.isCustom ? (85 + Math.random() * 30) : (22 + Math.random() * 10);
        
        // 자연스러운 좌우/상하 자유로운 수영 방향 지정
        this.dirX = Math.random() < 0.5 ? 1 : -1;
        
        if (initial) {
          this.x = Math.random() * (canvas.width - 120) + 60;
          this.y = Math.random() * (canvas.height - 120) + 60;
        } else {
          this.x = this.dirX === 1 ? -this.size : canvas.width + this.size;
          this.y = Math.random() * (canvas.height - 120) + 60;
        }

        // 자연스럽게 유영하는 속도 (0.6 ~ 1.5)
        this.speedX = (0.6 + Math.random() * 0.9) * this.dirX;
        this.speedY = (Math.random() - 0.5) * 0.6;
        this.angle = 0;
        this.swingSpeed = 0.02 + Math.random() * 0.03;
      }

      update() {
        this.x += this.speedX;
        this.angle += this.swingSpeed;
        this.y += Math.sin(this.angle) * 0.8 + this.speedY;

        // 화면 밖으로 나가면 자연스럽게 재배치
        if (this.x < -this.size * 2 || this.x > canvas.width + this.size * 2) {
          this.reset(false);
        }
        if (this.y < this.size || this.y > canvas.height - this.size) {
          this.speedY *= -1;
        }
      }

      draw() {
        ctx.save();
        const tilt = Math.sin(this.angle) * 0.15;
        ctx.translate(this.x, this.y);
        ctx.rotate(tilt);

        // 왼쪽으로 헤엄칠 때 반전 처리
        if (this.dirX < 0) {
          ctx.scale(-1, 1);
        }

        if (this.isCustom && this.img && this.img.complete) {
          ctx.shadowColor = 'rgba(0, 0, 0, 0.18)';
          ctx.shadowBlur = 10;
          ctx.shadowOffsetY = 4;
          ctx.drawImage(this.img, -this.size/2, -this.size/2, this.size, this.size);
        } else {
          ctx.font = `${this.size}px sans-serif`;
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.shadowColor = 'rgba(0, 0, 0, 0.1)';
          ctx.shadowBlur = 4;
          ctx.fillText(this.emoji, 0, 0);
        }

        ctx.restore();
      }

      isTouched(px, py) {
        const dist = Math.hypot(this.x - px, this.y - py);
        return dist < this.size * 0.85;
      }

      swimFast() {
        // 터치 시 자연스럽게 휙 헤엄쳐 달아남
        this.speedX *= 2.5;
        this.speedY = (Math.random() - 0.5) * 3;
        setTimeout(() => {
          this.speedX /= 2.5;
          this.speedY = (Math.random() - 0.5) * 0.6;
        }, 800);
      }
    }

    function initCreatures() {
      creatures = [];
      // 업로드한 아이 그림
      customImages.forEach(imgData => {
        creatures.push(new SeaCreature(imgData));
      });

      // 배경을 채워줄 귀여운 이모티콘 친구들
      const count = Math.max(10 - customImages.length, 6);
      for (let i = 0; i < count; i++) {
        creatures.push(new SeaCreature());
      }
    }

    function animate() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      creatures.forEach(c => {
        c.update();
        c.draw();
      });
      requestAnimationFrame(animate);
    }

    // 흰색 배경 자동 누끼 제거
    function removeBackground(imgElement, callback) {
      const tempCanvas = document.createElement('canvas');
      const tempCtx = tempCanvas.getContext('2d');
      tempCanvas.width = imgElement.width;
      tempCanvas.height = imgElement.height;

      tempCtx.drawImage(imgElement, 0, 0);
      const imgData = tempCtx.getImageData(0, 0, tempCanvas.width, tempCanvas.height);
      const data = imgData.data;

      for (let i = 0; i < data.length; i += 4) {
        if (data[i] > 205 && data[i + 1] > 205 && data[i + 2] > 205) {
          data[i + 3] = 0;
        }
      }

      tempCtx.putImageData(imgData, 0, 0);
      callback(tempCanvas.toDataURL());
    }

    fileInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = (event) => {
        const rawImg = new Image();
        rawImg.onload = () => {
          removeBackground(rawImg, (cutoutDataUrl) => {
            customImages.push(cutoutDataUrl);
            creatures.push(new SeaCreature(cutoutDataUrl));
          });
        };
        rawImg.src = event.target.result;
      };
      reader.readAsDataURL(file);
      fileInput.value = '';
    });

    resetBtn.addEventListener('click', () => {
      customImages = [];
      initCreatures();
    });

    // 맑은 도레미파솔라시도 음계 소리
    function playScaleSound() {
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        const ctxAudio = new AudioCtx();
        const osc = ctxAudio.createOscillator();
        const gain = ctxAudio.createGain();

        const freq = scaleNotes[noteIndex % scaleNotes.length];
        noteIndex++;

        osc.type = 'triangle';
        osc.frequency.setValueAtTime(freq, ctxAudio.currentTime);

        gain.gain.setValueAtTime(0.8, ctxAudio.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctxAudio.currentTime + 0.35);

        osc.connect(gain);
        gain.connect(ctxAudio.destination);

        osc.start();
        osc.stop(ctxAudio.currentTime + 0.35);
      } catch (e) {}
    }

    function handleTouch(e) {
      const rect = canvas.getBoundingClientRect();
      const clickX = e.clientX - rect.left;
      const clickY = e.clientY - rect.top;

      for (let i = creatures.length - 1; i >= 0; i--) {
        const c = creatures[i];
        if (c.isTouched(clickX, clickY)) {
          playScaleSound();
          showPopText(e.clientX, e.clientY, '✨');
          c.swimFast();
          break;
        }
      }
    }

    function showPopText(x, y, text) {
      const pop = document.createElement('div');
      pop.className = 'pop-effect';
      pop.style.left = `${x - 15}px`;
      pop.style.top = `${y - 25}px`;
      pop.textContent = text;
      document.body.appendChild(pop);
      setTimeout(() => pop.remove(), 600);
    }

    window.addEventListener('resize', resizeCanvas);
    canvas.addEventListener('pointerdown', handleTouch);

    resizeCanvas();
    initCreatures();
    animate();
  })();
</script>

</body>
</html>
