<script id="lumi-canvas-guard">
(function() {
  if (window.__lumiCanvasGuard) return;
  window.__lumiCanvasGuard = true;
  var MAX_PX = 4096, MIN_FONT_PX = 12;
  try {
    var CP = HTMLCanvasElement.prototype;
    var BOX = {width: 'clientWidth', height: 'clientHeight'}, D = {};
    Object.keys(BOX).forEach(function(p) {
      D[p] = Object.getOwnPropertyDescriptor(CP, p);
    });
    var tracking = function(el, p) {
      var box = el[BOX[p]];
      return !el.style[p] && box > 0 && box === D[p].get.call(el) &&
          box === el['__lumiLast' + p];
    };
    var MAX = {width: 'maxWidth', height: 'maxHeight'};
    var PAD = {width: ['paddingLeft', 'paddingRight'],
               height: ['paddingTop', 'paddingBottom']};
    var avail = function(el, p) {
      var pe = el.parentElement;
      if (!pe) return 0;
      var cs = getComputedStyle(pe);
      return pe[BOX[p]] - parseFloat(cs[PAD[p][0]]) -
          parseFloat(cs[PAD[p][1]]);
    };
    Object.keys(BOX).forEach(function(p) {
      var d = D[p];
      if (!d || !d.set || !d.get) return;
      Object.defineProperty(CP, p, {
        configurable: true, enumerable: d.enumerable, get: d.get,
        set: function(v) {
          var n = +v, box = this[BOX[p]];
          if (n > MAX_PX) n = MAX_PX;
          if (n > box && tracking(this, p)) {
            var el = this, pins = {};
            Object.keys(BOX).forEach(function(q) {
              if (tracking(el, q)) pins[q] = avail(el, q) ||
                  el['__lumiBox' + q];
            });
            Object.keys(pins).forEach(function(q) {
              el.style[q] = '100%';
              el.style[MAX[q]] = pins[q] + 'px';
            });
            n = box;
          }
          this['__lumiBox' + p] = box;
          this['__lumiLast' + p] = n;
          d.set.call(this, isNaN(n) ? v : n);
        }
      });
    });
  } catch (e) {}
  try {
    var XP = CanvasRenderingContext2D.prototype;
    var px = /(\d*\.?\d+)px/;
    var floorFont = function(ctx) {
      var f = ctx.font, m = px.exec(f);
      if (m && +m[1] >= 4 && +m[1] < MIN_FONT_PX) ctx.font = f.replace(px, MIN_FONT_PX + 'px');
    };
    ['fillText', 'strokeText', 'measureText'].forEach(function(k) {
      var o = XP[k];
      if (typeof o !== 'function') return;
      XP[k] = function() { floorFont(this); return o.apply(this, arguments); };
    });
  } catch (e) {}
})();
</script>

  <style>

    * {

      user-select: none;
      -webkit-user-select: none;

    body, html {
      width: 100%;

    .widget-container {

    @keyframes pastelRainbow {

    }

    #gameCanvas {

    /* 팝업 효과 텍스트 */
    .pop-effect {

    @keyframes popFade {
      0% { opacity: 1; transform: scale(0.8) translateY(0); }

    /* 안내 메시지 Overlay */
    .guide-overlay {

    /* 하단 안내 바 */
    .bottom-bar {
      position: relative;

      backdrop-filter: blur(6px);
      font-size: 20px;
      color: #3d5a80;
    }
  </style>
</head>
<body>

<div class="widget-container">
  <div class="ocean-overlay"></div>

  <!-- 상단 네비게이션 바 -->
  <div class="top-bar">
    <a href="index.html" class="home-btn" title="첫 페이지로 돌아가기">
      <div>
        <div class="home-icon-roof"></div>
        <div class="home-icon-body"></div>
      </div>
      <span class="home-btn-text">홈으로</span>
    </a>

    <div class="upload-controls">
      <label for="fileInput" class="btn-action">
        📷 그림 등록하기
      </label>
      <input type="file" id="fileInput" accept="image/*">
      <button class="btn-action" id="resetDrawingsBtn">💥 그림 초기화</button>
    </div>
  </div>

  <!-- 메인 바다 영역 -->
  <div class="game-area" id="gameArea">
    <div class="guide-overlay" id="guideOverlay">
      🎨 [그림 등록하기]를 눌러 아이 그림을 올려보세요! 배경을 자동으로 지워 바다에서 헤엄쳐요!
    </div>
    <canvas id="gameCanvas"></canvas>
  </div>

  <!-- 하단 안내 바 -->
  <div class="bottom-bar">
    🌊 내가 그린 물고기와 바다 친구들을 터치하면 신나는 소리와 함께 헤엄쳐요!
  </div>
</div>

<script>
  (function() {
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const gameArea = document.getElementById('gameArea');
    const fileInput = document.getElementById('fileInput');
    const resetDrawingsBtn = document.getElementById('resetDrawingsBtn');
    const guideOverlay = document.getElementById('guideOverlay');

    const defaultEmojis = ['🐙', '🦑', '🪼', '🦀', '🐠', '🐟', '🐡', '🐬', '🐳', '🦭', '⭐'];
    
    // 도레미파솔라시도 2옥타브 음계
    const scaleNotes = [
      261.63, 293.66, 329.63, 349.23, 392.00, 440.00, 493.88,
      523.25, 587.33, 659.25, 698.46, 783.99, 880.00, 987.77, 1046.50
    ];

    let creatures = [];
    let customImages = [];
    let noteIndex = 0;

    function resizeCanvas() {
      canvas.width = gameArea.clientWidth;
      canvas.height = gameArea.clientHeight;
    }

    class Creature {
      constructor(imgSrc = null) {
        this.imgSrc = imgSrc;
        this.reset();
      }

      reset() {
        if (!this.imgSrc) {
          this.emoji = defaultEmojis[Math.floor(Math.random() * defaultEmojis.length)];
          this.isCustom = false;
        } else {
          this.img = new Image();
          this.img.src = this.imgSrc;
          this.isCustom = true;
        }

        this.size = 80 + Math.random() * 40;
        this.x = Math.random() * (canvas.width - this.size * 2) + this.size;
        this.y = canvas.height + this.size + Math.random() * 100;
        
        this.speedY = 1.8 + Math.random() * 2.2;
        this.speedX = (Math.random() - 0.5) * 1.5;
        this.angle = 0;
        this.swingSpeed = 0.03 + Math.random() * 0.03;
      }

      update() {
        this.y -= this.speedY;
        this.angle += this.swingSpeed;
        this.x += Math.sin(this.angle) * 2.0 + this.speedX;

        if (this.y < -this.size * 2) {
          this.reset();
        }
        if (this.x < this.size || this.x > canvas.width - this.size) {
          this.speedX *= -1;
        }
      }

      draw() {
        ctx.save();
        const tilt = Math.sin(this.angle) * 0.2;
        ctx.translate(this.x, this.y);
        ctx.rotate(tilt);

        if (this.isCustom && this.img && this.img.complete) {
          ctx.shadowColor = 'rgba(0, 0, 0, 0.15)';
          ctx.shadowBlur = 10;
          ctx.shadowOffsetY = 5;
          ctx.drawImage(this.img, -this.size/2, -this.size/2, this.size, this.size);
        } else {
          ctx.font = `${this.size}px sans-serif`;
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.shadowColor = 'rgba(0, 0, 0, 0.12)';
          ctx.shadowBlur = 8;
          ctx.shadowOffsetY = 4;
          ctx.fillText(this.emoji, 0, 0);
        }

        ctx.restore();
      }

      isTouched(px, py) {
        const dist = Math.hypot(this.x - px, this.y - py);
        return dist < this.size * 0.75;
      }
    }

    function initCreatures() {
      creatures = [];
      // 등록된 유저 그림 추가
      customImages.forEach(imgData => {
        const c = new Creature(imgData);
        c.y = Math.random() * canvas.height;
        creatures.push(c);
      });

      // 부족한 자리는 기본 이모지 친구들로 채움 (최소 7마리)
      const fillCount = Math.max(7 - customImages.length, 3);
      for (let i = 0; i < fillCount; i++) {
        const c = new Creature();
        c.y = Math.random() * canvas.height;
        creatures.push(c);
      }
    }

    function animate() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      creatures.forEach(c => {
        c.update();
        c.draw();
      });
      requestAnimationFrame(animate);
    }

    /* 흰색/밝은 배경을 자동으로 제거(누끼)하는 처리 함수 */
    function removeBackground(imgElement, callback) {
      const tempCanvas = document.createElement('canvas');
      const tempCtx = tempCanvas.getContext('2d');
      tempCanvas.width = imgElement.width;
      tempCanvas.height = imgElement.height;

      tempCtx.drawImage(imgElement, 0, 0);
      const imgData = tempCtx.getImageData(0, 0, tempCanvas.width, tempCanvas.height);
      const data = imgData.data;

      // 흰색/연한 밝은 배경 투명 처리 (Threshold 적용)
      for (let i = 0; i < data.length; i += 4) {
        const r = data[i];
        const g = data[i + 1];
        const b = data[i + 2];

        // 흰색 또는 흰색에 가까운 파스텔 바탕 제거
        if (r > 200 && g > 200 && b > 200) {
          data[i + 3] = 0; // Alpha 0
        }
      }

      tempCtx.putImageData(imgData, 0, 0);
      callback(tempCanvas.toDataURL());
    }

    // 이미지 업로드 처리
    fileInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = (event) => {
        const rawImg = new Image();
        rawImg.onload = () => {
          removeBackground(rawImg, (cutoutDataUrl) => {
            customImages.push(cutoutDataUrl);
            const newCreature = new Creature(cutoutDataUrl);
            creatures.push(newCreature);
            guideOverlay.style.display = 'none';
          });
        };
        rawImg.src = event.target.result;
      };
      reader.readAsDataURL(file);
      fileInput.value = '';
    });

    // 그림 초기화
    resetDrawingsBtn.addEventListener('click', () => {
      customImages = [];
      initCreatures();
      guideOverlay.style.display = 'block';
    });

    // 2배 크고 밝은 도레미파솔라시도 소리 재생
    function playScaleSound() {
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        const ctxAudio = new AudioCtx();
        const osc = ctxAudio.createOscillator();
        const gain = ctxAudio.createGain();

        const freq = scaleNotes[noteIndex % scaleNotes.length];
        noteIndex++;

        osc.type = 'triangle';
        osc.frequency.setValueAtTime(freq, ctxAudio.currentTime);

        // 볼륨 2배 (0.8)
        gain.gain.setValueAtTime(0.8, ctxAudio.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctxAudio.currentTime + 0.4);

        osc.connect(gain);
        gain.connect(ctxAudio.destination);

        osc.start();
        osc.stop(ctxAudio.currentTime + 0.4);
      } catch (e) {}
    }

    function handleTouch(e) {
      const rect = canvas.getBoundingClientRect();
      const clickX = e.clientX - rect.left;
      const clickY = e.clientY - rect.top;

      for (let i = creatures.length - 1; i >= 0; i--) {
        const c = creatures[i];
        if (c.isTouched(clickX, clickY)) {
          playScaleSound();
          showPopText(e.clientX, e.clientY, c.isCustom ? '🎨 퐁당!' : '✨ 퐁당!');
          c.reset();
          break;
        }
      }
    }

    function showPopText(x, y, text) {
      const pop = document.createElement('div');
      pop.className = 'pop-effect';
      pop.style.left = `${x - 30}px`;
      pop.style.top = `${y - 40}px`;
      pop.textContent = text;
      document.body.appendChild(pop);
      setTimeout(() => pop.remove(), 600);
    }

    window.addEventListener('resize', resizeCanvas);
    canvas.addEventListener('pointerdown', handleTouch);

    resizeCanvas();
    initCreatures();
    animate();
  })();
</script>

</body>
</html>
