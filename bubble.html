<script id="lumi-canvas-guard">
(function() {
  if (window.__lumiCanvasGuard) return;
  window.__lumiCanvasGuard = true;
  var MAX_PX = 4096, MIN_FONT_PX = 12;
  try {
    var CP = HTMLCanvasElement.prototype;
    var BOX = {width: 'clientWidth', height: 'clientHeight'}, D = {};
    Object.keys(BOX).forEach(function(p) {
      D[p] = Object.getOwnPropertyDescriptor(CP, p);
    });
    var tracking = function(el, p) {
      var box = el[BOX[p]];
      return !el.style[p] && box > 0 && box === D[p].get.call(el) &&
          box === el['__lumiLast' + p];
    };
    var MAX = {width: 'maxWidth', height: 'maxHeight'};
    var PAD = {width: ['paddingLeft', 'paddingRight'],
               height: ['paddingTop', 'paddingBottom']};
    var avail = function(el, p) {
      var pe = el.parentElement;
      if (!pe) return 0;
      var cs = getComputedStyle(pe);
      return pe[BOX[p]] - parseFloat(cs[PAD[p][0]]) -
          parseFloat(cs[PAD[p][1]]);
    };
    Object.keys(BOX).forEach(function(p) {
      var d = D[p];
      if (!d || !d.set || !d.get) return;
      Object.defineProperty(CP, p, {
        configurable: true, enumerable: d.enumerable, get: d.get,
        set: function(v) {
          var n = +v, box = this[BOX[p]];
          if (n > MAX_PX) n = MAX_PX;
          if (n > box && tracking(this, p)) {
            var el = this, pins = {};
            Object.keys(BOX).forEach(function(q) {
              if (tracking(el, q)) pins[q] = avail(el, q) ||
                  el['__lumiBox' + q];
            });
            Object.keys(pins).forEach(function(q) {
              el.style[q] = '100%';
              el.style[MAX[q]] = pins[q] + 'px';
            });
            n = box;
          }
          this['__lumiBox' + p] = box;
          this['__lumiLast' + p] = n;
          d.set.call(this, isNaN(n) ? v : n);
        }
      });
    });
  } catch (e) {}
  try {
    var XP = CanvasRenderingContext2D.prototype;
    var px = /(\d*\.?\d+)px/;
    var floorFont = function(ctx) {
      var f = ctx.font, m = px.exec(f);
      if (m && +m[1] >= 4 && +m[1] < MIN_FONT_PX) ctx.font = f.replace(px, MIN_FONT_PX + 'px');
    };
    ['fillText', 'strokeText', 'measureText'].forEach(function(k) {
      var o = XP[k];
      if (typeof o !== 'function') return;
      XP[k] = function() { floorFont(this); return o.apply(this, arguments); };
    });
  } catch (e) {}
})();
</script>

<style id="lumi-runtime">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>파스텔 무지개 바다 친구들 - 신나는 유아용 게임</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Gamja+Flower&display=swap');

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      margin: 0;
      padding: 0;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: 'Gamja Flower', 'Google Sans Flex', cursive, sans-serif;
      background: #0f0f0f;
    }

    .widget-container {
      position: relative;
      width: 100%;
      height: 100vh;
      min-height: 520px;
      margin: 0 auto;
      overflow: hidden;
      background: linear-gradient(135deg, #ffc6ff, #ffffd1, #caffbf, #9bf6ff, #a0c4ff, #bdb2ff);
      background-size: 400% 400%;
      animation: pastelRainbow 12s ease infinite;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    @keyframes pastelRainbow {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .ocean-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
      background: radial-gradient(circle at 50% 120%, rgba(255, 255, 255, 0.4) 0%, rgba(255, 255, 255, 0) 70%);
    }

    /* 상단 네비게이션 바 */
    .top-bar {
      position: relative;
      z-index: 20;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 20px;
      background: rgba(255, 255, 255, 0.55);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border-bottom: 2px solid rgba(255, 255, 255, 0.7);
    }

    /* index.html 페이지 이동 링크로 작동하는 홈 버튼 */
    .home-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: #ffffff;
      border: 2px solid #ff99c8;
      border-radius: 999px;
      padding: 6px 16px;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0,0,0,0.08);
      transition: all 0.2s ease;
      text-decoration: none;
    }

    .home-btn:hover {
      transform: scale(1.05);
      background: #fff5f8;
    }

    .home-btn:active {
      transform: scale(0.95);
    }

    .home-icon-roof {
      width: 0;
      height: 0;
      border-left: 9px solid transparent;
      border-right: 9px solid transparent;
      border-bottom: 9px solid #ff5964;
      margin: 0 auto;
    }

    .home-icon-body {
      width: 14px;
      height: 10px;
      background: #ff924c;
      margin: -1px auto 0 auto;
      border-radius: 0 0 2px 2px;
    }

    .home-btn-text {
      font-size: 18px;
      font-weight: bold;
      color: #333;
    }

    .score-board {
      font-size: 22px;
      font-weight: bold;
      color: #4a4e69;
      background: rgba(255, 255, 255, 0.8);
      padding: 6px 18px;
      border-radius: 999px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }

    /* 게임 영역 */
    .game-area {
      position: relative;
      flex: 1;
      z-index: 10;
      width: 100%;
      height: 100%;
    }

    #gameCanvas {
      width: 100%;
      height: 100%;
      display: block;
      cursor: pointer;
    }

    /* 팝업 효과 텍스트 */
    .pop-effect {
      position: absolute;
      pointer-events: none;
      animation: popFade 0.6s forwards ease-out;
      font-size: 26px;
      font-weight: bold;
      color: #ff477e;
      z-index: 30;
      text-shadow: 0 2px 4px rgba(255,255,255,0.8);
    }

    @keyframes popFade {
      0% { opacity: 1; transform: scale(0.8) translateY(0); }
      100% { opacity: 0; transform: scale(1.6) translateY(-40px); }
    }

    /* 축하 모달 카드 */
    .celebration-modal {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.35);
      backdrop-filter: blur(4px);
      z-index: 50;
      display: flex;
      justify-content: center;
      align-items: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    .celebration-modal.active {
      opacity: 1;
      pointer-events: auto;
    }

    .celebration-card {
      background: #ffffff;
      border-radius: 28px;
      padding: 32px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
      border: 4px solid #ffb3c1;
      transform: scale(0.8);
      transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      max-width: 90%;
      width: 340px;
    }

    .celebration-modal.active .celebration-card {
      transform: scale(1);
    }

    .celebration-card h2 {
      font-size: 32px;
      color: #ff477e;
      margin-bottom: 12px;
    }

    .celebration-card p {
      font-size: 20px;
      color: #555;
      margin-bottom: 20px;
      line-height: 1.4;
    }

    .restart-btn {
      background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 100%);
      border: none;
      padding: 12px 28px;
      font-size: 20px;
      font-family: inherit;
      font-weight: bold;
      color: #fff;
      border-radius: 999px;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(255, 71, 126, 0.3);
      transition: transform 0.2s ease;
    }

    .restart-btn:hover {
      transform: scale(1.05);
    }

    /* 하단 안내 바 */
    .bottom-bar {
      position: relative;
      z-index: 20;
      text-align: center;
      padding: 12px;
      background: rgba(255, 255, 255, 0.5);
      backdrop-filter: blur(6px);
      font-size: 20px;
      color: #3d5a80;
    }
  </style>
</head>
<body>

<div class="widget-container">
  <div class="ocean-overlay"></div>

  <!-- 상단 바 (홈 버튼 클릭 시 index.html 메인 첫 페이지로 이동) -->
  <div class="top-bar">
    <a href="index.html" class="home-btn" title="첫 페이지로 돌아가기">
      <div>
        <div class="home-icon-roof"></div>
        <div class="home-icon-body"></div>
      </div>
      <span class="home-btn-text">홈</span>
    </a>
    <div class="score-board">
      ✨ 바다 친구들: <span id="score">0</span> / 15
    </div>
  </div>

  <!-- 메인 게임 영역 -->
  <div class="game-area" id="gameArea">
    <canvas id="gameCanvas"></canvas>
  </div>

  <!-- 하단 안내 바 -->
  <div class="bottom-bar">
    🐠 빠르게 헤엄치는 바다 친구들을 터치해 보세요!
  </div>

  <!-- 15번 성공 축하 모달 -->
  <div class="celebration-modal" id="celebrationModal">
    <div class="celebration-card">
      <h2>🎉 참 잘했어요! 🎉</h2>
      <p>바다 친구 15마리를 모두 모았어요!<br>정말 멋져요! 최고예요! 👏✨</p>
      <button class="restart-btn" id="restartBtn">다시 놀기 🎈</button>
    </div>
  </div>
</div>

<script>
  (function() {
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const celebrationModal = document.getElementById('celebrationModal');
    const restartBtn = document.getElementById('restartBtn');
    const gameArea = document.getElementById('gameArea');

    const emojiList = ['🐙', '🦑', '🪼', '🦀', '🦞', '🦐', '🐠', '🐟', '🐡', '🐬', '🐳', '🦭', '🪸', '🐚', '⭐'];
    
    // 도-레-미-파-솔-라-시-도 15단계 음계 주파수
    const scaleNotes = [
      261.63, // 도 (C4)
      293.66, // 레 (D4)
      329.63, // 미 (E4)
      349.23, // 파 (F4)
      392.00, // 솔 (G4)
      440.00, // 라 (A4)
      493.88, // 시 (B4)
      523.25, // 도 (C5)
      587.33, // 레 (D5)
      659.25, // 미 (E5)
      698.46, // 파 (F5)
      783.99, // 솔 (G5)
      880.00, // 라 (A5)
      987.77, // 시 (B5)
      1046.50 // 높은 도 (C6)
    ];

    let creatures = [];
    let score = 0;
    const maxScore = 15;
    let animationFrameId;

    function resizeCanvas() {
      canvas.width = gameArea.clientWidth;
      canvas.height = gameArea.clientHeight;
    }

    class Creature {
      constructor() {
        this.reset();
      }

      reset() {
        this.emoji = emojiList[Math.floor(Math.random() * emojiList.length)];
        this.size = 60 + Math.random() * 20;
        this.x = Math.random() * (canvas.width - this.size * 2) + this.size;
        this.y = canvas.height + this.size + Math.random() * 80;
        
        // 시원하고 빠른 올라오는 속도 유지 (3.5 ~ 6.0)
        this.speedY = 3.5 + Math.random() * 2.5; 
        this.speedX = (Math.random() - 0.5) * 2.0;
        this.angle = 0;
        this.swingSpeed = 0.04 + Math.random() * 0.04;
      }

      update() {
        this.y -= this.speedY;
        this.angle += this.swingSpeed;
        this.x += Math.sin(this.angle) * 2.0 + this.speedX;

        if (this.y < -this.size * 2) {
          this.reset();
        }
        if (this.x < this.size || this.x > canvas.width - this.size) {
          this.speedX *= -1;
        }
      }

      draw() {
        ctx.save();
        ctx.font = `${this.size}px sans-serif`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        
        const tilt = Math.sin(this.angle) * 0.2;
        ctx.translate(this.x, this.y);
        ctx.rotate(tilt);
        
        ctx.shadowColor = 'rgba(0, 0, 0, 0.12)';
        ctx.shadowBlur = 8;
        ctx.shadowOffsetY = 4;

        ctx.fillText(this.emoji, 0, 0);
        ctx.restore();
      }

      isTouched(px, py) {
        const dist = Math.hypot(this.x - px, this.y - py);
        return dist < this.size * 0.85;
      }
    }

    function initCreatures() {
      creatures = [];
      const count = 8;
      for (let i = 0; i < count; i++) {
        const c = new Creature();
        c.y = Math.random() * canvas.height;
        creatures.push(c);
      }
    }

    function animate() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      creatures.forEach(c => {
        c.update();
        c.draw();
      });
      animationFrameId = requestAnimationFrame(animate);
    }

    // 도레미파솔라시도 음계 소리 (볼륨 기존 대비 2배 확대: 0.4 -> 0.8)
    function playScaleSound(index) {
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        const ctxAudio = new AudioCtx();
        const osc = ctxAudio.createOscillator();
        const gain = ctxAudio.createGain();

        const freq = scaleNotes[Math.min(index, scaleNotes.length - 1)];
        
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(freq, ctxAudio.currentTime);

        // 게인(볼륨)을 2배 키운 0.8로 설정
        gain.gain.setValueAtTime(0.8, ctxAudio.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctxAudio.currentTime + 0.35);

        osc.connect(gain);
        gain.connect(ctxAudio.destination);

        osc.start();
        osc.stop(ctxAudio.currentTime + 0.35);
      } catch (e) {}
    }

    function handleTouch(e) {
      if (score >= maxScore) return;

      const rect = canvas.getBoundingClientRect();
      const clickX = e.clientX - rect.left;
      const clickY = e.clientY - rect.top;

      for (let i = creatures.length - 1; i >= 0; i--) {
        const c = creatures[i];
        if (c.isTouched(clickX, clickY)) {
          // 2배 커진 도레미파솔라시도 음계 재생
          playScaleSound(score);

          score += 1;
          scoreEl.textContent = score;

          showPopText(e.clientX, e.clientY);

          c.reset();

          if (score >= maxScore) {
            setTimeout(showCelebration, 300);
          }
          break;
        }
      }
    }

    function showPopText(x, y) {
      const pop = document.createElement('div');
      pop.className = 'pop-effect';
      pop.style.left = `${x - 20}px`;
      pop.style.top = `${y - 40}px`;
      pop.textContent = '+1 ✨';
      document.body.appendChild(pop);
      setTimeout(() => pop.remove(), 600);
    }

    function showCelebration() {
      celebrationModal.classList.add('active');
    }

    function resetGame() {
      score = 0;
      scoreEl.textContent = score;
      celebrationModal.classList.remove('active');
      initCreatures();
    }

    window.addEventListener('resize', resizeCanvas);
    canvas.addEventListener('pointerdown', handleTouch);

    restartBtn.addEventListener('click', resetGame);

    resizeCanvas();
    initCreatures();
    animate();
  })();
</script>

</body>
</html>
