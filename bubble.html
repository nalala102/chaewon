<html lang="ko">
<head>
<script id="lumi-canvas-guard">
(function() {
  if (window.__lumiCanvasGuard) return;
  window.__lumiCanvasGuard = true;
  var MAX_PX = 4096, MIN_FONT_PX = 12;
  try {
    var CP = HTMLCanvasElement.prototype;
    var BOX = {width: 'clientWidth', height: 'clientHeight'}, D = {};
    Object.keys(BOX).forEach(function(p) {
      D[p] = Object.getOwnPropertyDescriptor(CP, p);
    });
    var tracking = function(el, p) {
      var box = el[BOX[p]];
      return !el.style[p] && box > 0 && box === D[p].get.call(el) &&
          box === el['__lumiLast' + p];
    };
    var MAX = {width: 'maxWidth', height: 'maxHeight'};
    var PAD = {width: ['paddingLeft', 'paddingRight'],
               height: ['paddingTop', 'paddingBottom']};
    var avail = function(el, p) {
      var pe = el.parentElement;
      if (!pe) return 0;
      var cs = getComputedStyle(pe);
      return pe[BOX[p]] - parseFloat(cs[PAD[p][0]]) -
          parseFloat(cs[PAD[p][1]]);
    };
    Object.keys(BOX).forEach(function(p) {
      var d = D[p];
      if (!d || !d.set || !d.get) return;
      Object.defineProperty(CP, p, {
        configurable: true, enumerable: d.enumerable, get: d.get,
        set: function(v) {
          var n = +v, box = this[BOX[p]];
          if (n > MAX_PX) n = MAX_PX;
          if (n > box && tracking(this, p)) {
            var el = this, pins = {};
            Object.keys(BOX).forEach(function(q) {
              if (tracking(el, q)) pins[q] = avail(el, q) ||
                  el['__lumiBox' + q];
            });
            Object.keys(pins).forEach(function(q) {
              el.style[q] = '100%';
              el.style[MAX[q]] = pins[q] + 'px';
            });
            n = box;
          }
          this['__lumiBox' + p] = box;
          this['__lumiLast' + p] = n;
          d.set.call(this, isNaN(n) ? v : n);
        }
      });
    });
  } catch (e) {}
  try {
    var XP = CanvasRenderingContext2D.prototype;
    var px = /(\d*\.?\d+)px/;
    var floorFont = function(ctx) {
      var f = ctx.font, m = px.exec(f);
      if (m && +m[1] >= 4 && +m[1] < MIN_FONT_PX) ctx.font = f.replace(px, MIN_FONT_PX + 'px');
    };
    ['fillText', 'strokeText', 'measureText'].forEach(function(k) {
      var o = XP[k];
      if (typeof o !== 'function') return;
      XP[k] = function() { floorFont(this); return o.apply(this, arguments); };
    });
  } catch (e) {}
})();
</script>

/* luminous.css */
/*
 * Luminous runtime stylesheet — injected once into every generated widget's
 * <head> by the C++ widget agent (id="lumi-runtime"). Single Source of Truth
 * for ALL design tokens and pre-baked .lumi-* component classes. The SI prompts
 * (design.md / html_generation.jinja2 / chart.jinja2) must NOT re-declare these
 * tokens or component CSS; they only reference them.
 *
 * Sections:
 *   1. Web fonts (Google Sans Flex + Google Sans Code)
 *   2. Light token :root (from previewer tokens.css, verbatim)
 *   3. Dark token overrides — REMAPPED to :root so canvas/D3 readers of
 *      getComputedStyle(document.documentElement) resolve dark values (D3).
 *   4. Short diagram/chart aliases (bridge legacy --surface / --chart-N names).
 *   5. In-scope pre-baked .lumi-* component classes.
 */

/* ============================================================
 * 1. WEB FONTS  (Google Sans Flex + Google Sans Code only)
 *    Material Symbols Outlined is intentionally NOT loaded: no in-scope
 *    .lumi-* control has a functional CSS glyph dependency on it, and the
 *    icon ban forbids decorative icons (Decision D2).
 * ============================================================ */

/* ============================================================
 * 4. SHORT DIAGRAM / CHART ALIASES
 *    Legacy diagram.md and chart.jinja2 reference short names such as
 *    --surface, --on-surface, --chart-1..10, --primary, --r-full. These MUST
 *    resolve to the canonical --lumi-sys-color--* tokens (which flip in dark
 *    mode) — otherwise every diagram var() falls back to black (historical
 *    mass-regression bug #4). Light-hex fallbacks are a last resort only.
 * ============================================================ */
:root {
  /* surfaces */
  --surface: var(--lumi-sys-color--surface, #fdfcfc);
  --surface-dim: var(--lumi-sys-color--surface-dim, #f2f0f0);
  --surface-bright: var(--lumi-sys-color--surface-bright, #ffffff);
  --surface-container: var(--lumi-sys-color--surface-container, #f2f0f0);
  --surface-container-high: var(--lumi-sys-color--surface-container-high, #e6e6e6);
  --surface-container-lowest: var(--lumi-sys-color--surface, #ffffff);
  --surface-accent: var(--lumi-sys-color--surface-accent, #9dd2ff);
  --surface-translucent: var(--lumi-sys-color--surface-translucent, rgba(255, 255, 255, 0.88));

/* ============================================================
 * 5. IN-SCOPE PRE-BAKED COMPONENT CLASSES
 *    Interactive controls + simple display components only (Decision D5).
 *    Complex components (timeline, sequence, stepper, pros-cons, hero, HUD,
 *    hotspot, media grid) are intentionally excluded.
 * ============================================================ */

/* Global font rendering quality + themed surface backdrop.
 * background/color MUST be set here (SSoT) so the widget backdrop follows the
 * light/dark surface token deterministically. Without this, a widget whose
 * model-generated markup forgets `background: var(--surface)` on its root
 * container falls back to the browser-default white body, producing a broken
 * dark mode (light header/chart area behind a dark card). Regression source:
 * batch1 PB-A02 dark. */
html, body {
  background: var(--body-bg, transparent) !important;
  color: var(--on-surface) !important;
  /* Auto-resizing iframe: content grows the frame, never scrolls the document.
   * Model widgets already emit this; declared here as the SSoT default. */
  overflow-y: hidden;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  font-optical-sizing: auto;
  text-rendering: optimizeLegibility;
}

.widget-container {
  width: 100% !important;
  max-width: 100% !important;
  padding-inline: 0 !important;
  box-sizing: border-box;
}

/* ============================================================
 * SCROLLBAR DISCIPLINE (single source of truth)
 *   Long lists/cards flow and let the iframe auto-resize (see the C++
 *   NeutralizeInnerScroll pass, which removes accidental tiny scroll boxes).
 *   For LEGITIMATE overflow that remains (wide tables, code, pan-containers,
 *   large >=240px viewports) render a slim, theme-aware scrollbar.
 *   One token carries the correct light/dark contrast (the auto-flipped
 *   stroke token is too dark on #0f0f0f), referenced once = SSoT.
 * ============================================================ */
:root { --lumi-scrollbar-thumb: rgba(0, 0, 0, 0.20); }
:root[data-theme="dark"], body.dark-mode { --lumi-scrollbar-thumb: rgba(255, 255, 255, 0.20); }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --lumi-scrollbar-thumb: rgba(255, 255, 255, 0.20); }
}
* {
  scrollbar-width: thin;
  scrollbar-color: var(--lumi-scrollbar-thumb) transparent;
}
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb {
  background-color: var(--lumi-scrollbar-thumb);
  border-radius: var(--lumi-sys-shape--full, 999px);
}

/* --- Buttons --- */
/* Universal button fallback (element specificity 0,0,1) — beats `* { padding: 0 }`
   author resets (0,0,0) while still yielding to any author class selector (0,1,0). */
button {
  appearance: none;
  -webkit-appearance: none;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: var(--lumi-sys-spacing--xs, 6px);
  min-height: 36px;
  padding: 6px 16px;
  font-family: var(--ff-sans, 'Google Sans Flex', 'Google Sans', sans-serif);
  font-size: 13px;
  font-weight: 500;
  line-height: 18px;

<script id="lumi-os-theme-init">
(function() {
  function syncBody() {
    var dt = document.documentElement.getAttribute('data-theme');
    if (document.body && (dt === 'dark' || dt === 'light')) {
      document.body.classList.toggle('dark-mode', dt === 'dark');
    }
  }
  function syncTheme(theme) {
    if (theme !== 'dark' && theme !== 'light') return;
    document.documentElement.setAttribute('data-theme', theme);
    syncBody();
  }
  if (typeof MutationObserver === 'function') {
    new MutationObserver(syncBody).observe(document.documentElement, {
      attributes: true, attributeFilter: ['data-theme']
    });
  }
  if (typeof document.addEventListener === 'function') {
    document.addEventListener('DOMContentLoaded', syncBody);
  }
  try {
    var mq = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)');
    if (mq) {
      var cur = document.documentElement.getAttribute('data-theme');
      if (!cur) {
        syncTheme(mq.matches ? 'dark' : 'light');
      } else {
        syncTheme(cur);
      }
      if (mq.addEventListener) {
        mq.addEventListener('change', function(e) {
          syncTheme(e.matches ? 'dark' : 'light');
        });
      }
    }
  } catch (e) {}
  window.addEventListener('message', function(e) {
    if (e.data && (e.data.type === 'set-theme' || e.data.type === 'APPLY_THEME') && e.data.theme) {
      syncTheme(e.data.theme);
    }
  });
})();
</script>

  // --- Audio Synthesis Setup (Web Audio API) ---
  class DoremiPiano {
    constructor() {
      this.ctx = null;
      // Do Re Mi Fa Sol La Ti Do Re Mi frequencies
      this.scale = [
        { freq: 261.63, name: '도' }, // C4
        { freq: 293.66, name: '레' }, // D4
        { freq: 329.63, name: '미' }, // E4
        { freq: 349.23, name: '파' }, // F4
        { freq: 392.00, name: '솔' }, // G4
        { freq: 440.00, name: '라' }, // A4
        { freq: 493.88, name: '시' }, // B4
        { freq: 523.25, name: '도' }, // C5
        { freq: 587.33, name: '레' }, // D5
        { freq: 659.25, name: '미' }  // E5
      ];
    }

    init() {
      if (!this.ctx) {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        this.ctx = new AudioCtx();
      }
      if (this.ctx.state === 'suspended') {
        this.ctx.resume();
      }
    }

    playNote(index) {
      this.init();
      if (!this.ctx) return '도';

      const note = this.scale[index % this.scale.length];
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();

      // Soft piano-like timbre (combination of sine & subtle triangle wave harmonics)
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(note.freq, this.ctx.currentTime);

      // Fast attack, exponential decay envelope
      gain.gain.setValueAtTime(0.01, this.ctx.currentTime);
      gain.gain.linearRampToValueAtTime(0.6, this.ctx.currentTime + 0.03);
      gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 1.2);

      osc.connect(gain);
      gain.connect(this.ctx.destination);

      osc.start();
      osc.stop(this.ctx.currentTime + 1.25);

      return note.name;
    }

    playFanfare() {
      this.init();
      if (!this.ctx) return;

      const fanfareNotes = [261.63, 329.63, 392.00, 523.25, 659.25];
      fanfareNotes.forEach((freq, i) => {
        setTimeout(() => {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
          gain.gain.setValueAtTime(0.3, this.ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 1.5);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start();
          osc.stop(this.ctx.currentTime + 1.6);
        }, i * 120);
      });
    }
  }

    `<svg viewBox="0 0 100 100"><path d="M20,65 Q20,20 50,20 Q80,20 80,65 Q50,80 20,65 Z" fill="#f72585"/><path d="M50,20 L50,75 M35,24 L42,72 M65,24 L58,72 M23,40 L36,68 M77,40 L64,68" stroke="#7209b7" stroke-width="2.5"/><circle cx="42" cy="50" r="3" fill="#000"/><circle cx="58" cy="50" r="3" fill="#000"/><path d="M46,58 Q50,62 54,58" stroke="#000" stroke-width="2" fill="none"/></svg>`,
    // 9. Dolphin
    `<svg viewBox="0 0 100 100"><path d="M15,60 Q35,20 70,30 Q90,38 85,55 Q65,65 15,60 Z" fill="#48cae4"/><path d="M70,30 L78,15 L62,26 Z" fill="#0077b6"/><path d="M15,60 L5,50 L8,68 Z" fill="#0077b6"/><circle cx="65" cy="38" r="3.5" fill="#000"/><path d="M72,48 Q78,50 82,45" stroke="#000" stroke-width="2" fill="none"/></svg>`,
    // 10. Tropical Fish
    `<svg viewBox="0 0 100 100"><path d="M30,50 L10,30 L10,70 Z" fill="#ffb703"/><ellipse cx="55" cy="50" rx="30" ry="22" fill="#fb8500"/><path d="M45,28 L45,72 M60,30 L60,70" stroke="#ffb703" stroke-width="5"/><circle cx="70" cy="44" r="3.5" fill="#000"/><path d="M72,54 Q77,58 82,53" stroke="#000" stroke-width="2" fill="none"/></svg>`
  ];

  // --- Game State Variables ---
  let count = 0;
  const TARGET_COUNT = 10;
  const playfield = document.getElementById('playfield');
  const scoreText = document.getElementById('scoreText');
  const victoryModal = document.getElementById('victoryModal');
  const restartBtn = document.getElementById('restartBtn');
  const homeBtn = document.getElementById('homeBtn');
  const downloadBtn = document.getElementById('downloadBtn');

  // Particle System setup
  const fxCanvas = document.getElementById('fxCanvas');
  const ctx = fxCanvas.getContext('2d');
  let particles = [];

  function resizeCanvas() {
    const container = document.getElementById('appContainer');
    fxCanvas.width = container.clientWidth;
    fxCanvas.height = container.clientHeight;
  }
  window.addEventListener('resize', resizeCanvas);
  resizeCanvas();

  class Particle {
    constructor(x, y, color) {
      this.x = x;
      this.y = y;
      this.color = color || `hsl(${Math.random() * 360}, 90%, 65%)`;
      this.radius = Math.random() * 6 + 4;
      this.vx = (Math.random() - 0.5) * 8;
      this.vy = (Math.random() - 0.5) * 8 - 2;
      this.alpha = 1;
      this.decay = Math.random() * 0.02 + 0.015;
    }

    update() {
      this.x += this.vx;
      this.y += this.vy;
      this.vy += 0.15; // Gravity
      this.alpha -= this.decay;
    }

    draw(ctx) {
      ctx.save();
      ctx.globalAlpha = Math.max(0, this.alpha);
      ctx.beginPath();
      ctx.fillStyle = this.color;
      ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }
  }

  function createBurst(x, y, num = 20) {
    const colors = ['#ff70a6', '#ffd166', '#06d6a0', '#118ab2', '#073b4c', '#70d6ff'];
    for (let i = 0; i < num; i++) {
      particles.push(new Particle(x, y, colors[Math.floor(Math.random() * colors.length)]));
    }
  }

  function animateParticles() {
    ctx.clearRect(0, 0, fxCanvas.width, fxCanvas.height);
    for (let i = particles.length - 1; i >= 0; i--) {
      particles[i].update();
      particles[i].draw(ctx);
      if (particles[i].alpha <= 0) {
        particles.splice(i, 1);
      }
    }
    requestAnimationFrame(animateParticles);
  }
  animateParticles();

  // --- Character Spawning & Motion Engine ---
  let activeCharacters = [];
  let spawnTimer = null;

  function spawnCharacter() {
    if (count >= TARGET_COUNT) return;

    const charElem = document.createElement('div');
    charElem.className = 'sea-character';

    // Select SVG corresponding to current scale index or random
    const svgIndex = (count + activeCharacters.length) % CHARACTERS.length;
    if (charElem) charElem.innerHTML = CHARACTERS[svgIndex];

    const containerWidth = playfield.clientWidth || 360;
    const posX = Math.random() * (containerWidth - 110) + 10;
    charElem.style.left = `${posX}px`;

    // Speed / Duration based on viewport height
    const speed = Math.random() * 2 + 2.2; // Vertical speed
    let currentPosY = -120; // Bottom offset
    let swayOffset = Math.random() * 100;

    playfield.appendChild(charElem);

    const charObj = {
      elem: charElem,
      x: posX,
      y: currentPosY,
      speed: speed,
      swayOffset: swayOffset,
      isPopped: false
    };

    activeCharacters.push(charObj);

    // Click / Touch Handler
    const onPop = (e) => {
      e.preventDefault();
      if (charObj.isPopped) return;
      charObj.isPopped = true;

      const rect = charElem.getBoundingClientRect();
      const playfieldRect = playfield.getBoundingClientRect();
      const clickX = rect.left + rect.width / 2 - playfieldRect.left;
      const clickY = rect.top + rect.height / 2 - playfieldRect.top;

      // Play Piano Scale Sound & get Note Name
      const noteName = piano.playNote(count);

      // Star Particles Burst
      createBurst(clickX, clickY, 25);

      // Floating Musical Scale Text
      showFloatingText(clickX, clickY, `${noteName} 🎵`);

      // Increment Score
      count++;
      updateScoreUI();

      // Remove Character Element with animation
      charElem.style.transform = 'scale(1.4)';
      charElem.style.opacity = '0';
      setTimeout(() => {
        if (charElem.parentNode) charElem.parentNode.removeChild(charElem);
      }, 150);

      // Remove from active array
      const idx = activeCharacters.indexOf(charObj);
      if (idx > -1) activeCharacters.splice(idx, 1);

      // Victory Condition Trigger
      if (count >= TARGET_COUNT) {
        triggerVictory();
      }
    };

    charElem.addEventListener('pointerdown', onPop);
  }

  function showFloatingText(x, y, text) {
    const popText = document.createElement('div');
    popText.className = 'sound-pop-text';
    if (popText) popText.textContent = text;
    popText.style.left = `${x}px`;
    popText.style.top = `${y}px`;
    playfield.appendChild(popText);

    setTimeout(() => {
      if (popText.parentNode) popText.parentNode.removeChild(popText);
    }, 950);
  }

  function updateGamePhysics() {
    const containerHeight = playfield.clientHeight || 450;

    for (let i = activeCharacters.length - 1; i >= 0; i--) {
      const char = activeCharacters[i];
      if (char.isPopped) continue;

      char.y += char.speed;
      const sway = Math.sin((char.y + char.swayOffset) * 0.03) * 20;

      char.elem.style.bottom = `${char.y}px`;
      char.elem.style.transform = `translateX(${sway}px)`;

      // If character rises above top, recycle it to bottom
      if (char.y > containerHeight + 100) {
        if (char.elem.parentNode) char.elem.parentNode.removeChild(char.elem);
        activeCharacters.splice(i, 1);
      }
    }

    requestAnimationFrame(updateGamePhysics);
  }
  updateGamePhysics();

  function startSpawning() {
    stopSpawning();
    spawnTimer = setInterval(() => {
      if (activeCharacters.length < 4 && count < TARGET_COUNT) {
        spawnCharacter();
      }
    }, 1100);
  }

  function stopSpawning() {
    if (spawnTimer) clearInterval(spawnTimer);
  }

  function updateScoreUI() {
    if (scoreText) scoreText.textContent = `바다 친구: ${count} / ${TARGET_COUNT}`;
  }

  // --- Victory & Fireworks ---
  function triggerVictory() {
    stopSpawning();
    piano.playFanfare();

    // Launch Fireworks Explosions
    const width = fxCanvas.width;
    const height = fxCanvas.height;
    for (let i = 0; i < 6; i++) {
      setTimeout(() => {
        createBurst(Math.random() * (width - 100) + 50, Math.random() * (height / 2) + 100, 40);
      }, i * 250);
    }

    setTimeout(() => {
      victoryModal.classList.add('is-active');
    }, 600);
  }

  function resetGame() {
    count = 0;
    updateScoreUI();
    victoryModal.classList.remove('is-active');

    // Clean active characters
    activeCharacters.forEach(c => {
      if (c.elem.parentNode) c.elem.parentNode.removeChild(c.elem);
    });
    activeCharacters = [];

    // Initial Spawns
    spawnCharacter();
    setTimeout(spawnCharacter, 400);
    startSpawning();
  }

  // --- Event Listeners ---
  restartBtn.addEventListener('click', resetGame);

  homeBtn.addEventListener('click', (e) => {
    // Simulated navigation fallback if index.html is missing
    if (window.location.protocol === 'file:' || window.location.pathname.endsWith('index.html')) {
      // allow default
    } else {
      e.preventDefault();
      alert('🏠 홈 버튼 클릭: 메인 index.html 페이지로 이동합니다.');
    }
  });

  // Standalone HTML Download Feature
  downloadBtn.addEventListener('click', () => {
    const htmlContent = document.documentElement.outerHTML;
    const blob = new Blob([htmlContent], { type: 'text/html;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'Gamja_Ocean_Doremi_Game.html';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  });

  // Start initial game round
  resetGame();

  // --- Iframe Auto-Resize Support ---
  (function autoResize() {
    function notifyHeight() {
      const container = document.getElementById('appContainer');
      if (!container) return;
      const h = Math.ceil(Math.max(container.getBoundingClientRect().height, container.scrollHeight));
      window.parent.postMessage({ type: 'widget-resize', height: h }, '*');
    }
    window.addEventListener('load', () => setTimeout(notifyHeight, 150));
    if (window.ResizeObserver) {
      new ResizeObserver(notifyHeight).observe(document.getElementById('appContainer'));
    }
  })();
</script>

<script>/*luminous-slider-normalizer*/(function(){function f(r){if(!r||r.type!=='range')return;var mn=parseFloat(r.min||'0'),mx=parseFloat(r.max||'100'),v=parseFloat(r.value);if(isNaN(v))v=(mn+mx)/2;var p=mx>mn?((v-mn)/(mx-mn))*100:50;r.style.setProperty('--progress',p+'%');r.style.removeProperty('--slider-fill');}function all(){document.querySelectorAll('input[type="range"], .lumi-slider').forEach(f);}document.addEventListener('input',function(e){f(e.target);});if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',all);else all();})();</script>
