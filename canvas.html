<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>채원이의 알록달록 그림판 🎨</title>
  
  <!-- Google Fonts: 감자꽃 폰트 불러오기 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Gamja+Flower&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --primary-color: #ff6b81;
      --secondary-color: #ffbe76;
      --accent-color: #48dbfb;
      --bg-color: #f7f1e3;
      --panel-bg: #ffffff;
      --text-color: #2f3542;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      font-family: 'Gamja Flower', cursive, sans-serif;
      background-color: var(--bg-color);
      background-image: radial-gradient(#ffeaa7 2px, transparent 2px);
      background-size: 24px 24px;
      color: var(--text-color);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 15px;
    }

    header {
      width: 100%;
      max-width: 900px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .title {
      font-size: 2.2rem;
      color: #ff4757;
      text-shadow: 2px 2px 0px #ffffff;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .nav-btn {
      background-color: #ff7e5f;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 20px;
      font-size: 1.2rem;
      cursor: pointer;
      text-decoration: none;
      font-weight: bold;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      transition: all 0.2s ease;
      font-family: 'Gamja Flower', cursive;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    .nav-btn:hover {
      background-color: #e0664a;
      transform: translateY(-2px);
    }

    .app-container {
      width: 100%;
      max-width: 900px;
      background: var(--panel-bg);
      border-radius: 25px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
      padding: 15px;
      display: flex;
      flex-direction: column;
      gap: 15px;
      border: 4px solid #f8c291;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
      justify-content: space-between;
      background: #f1f2f6;
      padding: 12px;
      border-radius: 20px;
    }

    .tool-group {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .tool-btn {
      background-color: white;
      border: 2px solid #ced6e0;
      padding: 8px 14px;
      border-radius: 15px;
      font-size: 1.2rem;
      cursor: pointer;
      font-family: 'Gamja Flower', cursive;
      display: flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 3px 0 #ced6e0;
      transition: all 0.1s;
    }

    .tool-btn:hover {
      background-color: #f1f2f6;
    }

    .tool-btn.active {
      border-color: #ff4757;
      background-color: #ff788e;
      color: white;
      box-shadow: 0 3px 0 #e84118;
    }

    .chawon-btn {
      background: linear-gradient(135deg, #ff9ff3, #feca57);
      border: 2px solid #ff6b6b;
      color: #222;
      font-weight: bold;
      box-shadow: 0 4px 0 #ee5253;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.03); }
      100% { transform: scale(1); }
    }

    .chawon-btn img {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid white;
    }

    .palette {
      display: flex;
      gap: 6px;
      align-items: center;
    }

    .color-swatch {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      cursor: pointer;
      border: 3px solid white;
      box-shadow: 0 2px 5px rgba(0,0,0,0.2);
      transition: transform 0.15s;
    }

    .color-swatch:hover, .color-swatch.active {
      transform: scale(1.2);
      border-color: #2f3542;
    }

    .size-picker {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 1.1rem;
    }

    .size-picker input {
      accent-color: var(--primary-color);
      cursor: pointer;
    }

    .canvas-wrapper {
      position: relative;
      width: 100%;
      height: 480px;
      background-color: #ffffff;
      border-radius: 18px;
      border: 3px dashed #70a1ff;
      overflow: hidden;
      touch-action: none;
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
      cursor: crosshair;
    }

    .action-btn {
      background-color: #1dd1a1;
      color: white;
      border: none;
      padding: 8px 15px;
      border-radius: 15px;
      font-size: 1.2rem;
      cursor: pointer;
      box-shadow: 0 3px 0 #10ac84;
      font-family: 'Gamja Flower', cursive;
    }

    .action-btn.clear {
      background-color: #ff6b6b;
      box-shadow: 0 3px 0 #ee5253;
    }

    @media (max-width: 600px) {
      .canvas-wrapper {
        height: 360px;
      }
      .title {
        font-size: 1.6rem;
      }
      .tool-btn {
        padding: 6px 10px;
        font-size: 1rem;
      }
    }
  </style>
</head>
<body>

  <header>
    <a href="index.html" class="nav-btn">🏠 홈으로</a>
    <h1 class="title">🎨 채원이의 그림판</h1>
  </header>

  <div class="app-container">
    <div class="toolbar">
      <!-- 도구 선택 (펜, 지우개, 채원 도장) -->
      <div class="tool-group">
        <button id="brushBtn" class="tool-btn active" onclick="setMode('brush')">✏️ 펜</button>
        <button id="eraserBtn" class="tool-btn" onclick="setMode('eraser')">🧹 지우개</button>
        
        <!-- chaewon.png 이미지 버튼 -->
        <button id="chawonBtn" class="tool-btn chawon-btn" onclick="setMode('chawon')">
          <img src="chaewon.png" id="chawonBtnImg" alt="채원" onerror="this.src='chawon.png'">
          👶 채원이 도장
        </button>
      </div>

      <!-- 색상 팔레트 -->
      <div class="tool-group palette" id="palette"></div>

      <!-- 선/도장 굵기 및 저장 버튼 -->
      <div class="tool-group">
        <div class="size-picker">
          <span>크기</span>
          <input type="range" id="brushSize" min="5" max="80" value="20">
        </div>
        <button class="action-btn clear" onclick="clearCanvas()">🗑️ 싹 지우기</button>
        <button class="action-btn" onclick="saveCanvas()">💾 그림 저장</button>
      </div>
    </div>

    <!-- 캔버스 영역 -->
    <div class="canvas-wrapper" id="canvasWrapper">
      <canvas id="paintCanvas"></canvas>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('paintCanvas');
    const ctx = canvas.getContext('2d');
    const wrapper = document.getElementById('canvasWrapper');
    
    let isDrawing = false;
    let currentMode = 'brush'; // 'brush', 'eraser', 'chawon'
    let currentColor = '#ff4757';
    let currentSize = 20;

    // chaewon.png 이미지 불러오기
    const chaewonImg = new Image();
    chaewonImg.src = 'chaewon.png';

    chaewonImg.onerror = () => {
      // 이미지 파일 로드 실패 시 chawon.png 백업 시도
      chaewonImg.src = 'chawon.png';
    };

    function resizeCanvas() {
      const rect = wrapper.getBoundingClientRect();
      
      const tempCanvas = document.createElement('canvas');
      tempCanvas.width = canvas.width;
      tempCanvas.height = canvas.height;
      const tempCtx = tempCanvas.getContext('2d');
      if (canvas.width > 0 && canvas.height > 0) {
        tempCtx.drawImage(canvas, 0, 0);
      }

      canvas.width = rect.width;
      canvas.height = rect.height;

      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      
      if (tempCanvas.width > 0) {
        ctx.drawImage(tempCanvas, 0, 0);
      }
    }

    const colors = [
      '#ff4757', '#ffa502', '#eccc68', '#2ed573', 
      '#1e90ff', '#3742fa', '#9c88ff', '#2f3542', '#ffffff'
    ];

    function createPalette() {
      const paletteContainer = document.getElementById('palette');
      colors.forEach((color, idx) => {
        const swatch = document.createElement('div');
        swatch.className = 'color-swatch' + (idx === 0 ? ' active' : '');
        swatch.style.backgroundColor = color;
        swatch.onclick = () => {
          document.querySelectorAll('.color-swatch').forEach(s => s.classList.remove('active'));
          swatch.classList.add('active');
          currentColor = color;
          if (currentMode === 'eraser') setMode('brush');
        };
        paletteContainer.appendChild(swatch);
      });
    }

    function setMode(mode) {
      currentMode = mode;
      document.querySelectorAll('.tool-btn').forEach(btn => btn.classList.remove('active'));

      if (mode === 'brush') {
        document.getElementById('brushBtn').classList.add('active');
      } else if (mode === 'eraser') {
        document.getElementById('eraserBtn').classList.add('active');
      } else if (mode === 'chawon') {
        document.getElementById('chawonBtn').classList.add('active');
      }
    }

    function getPos(e) {
      const rect = canvas.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      return {
        x: clientX - rect.left,
        y: clientY - rect.top
      };
    }

    function startDrawing(e) {
      isDrawing = true;
      const pos = getPos(e);

      if (currentMode === 'chawon') {
        drawChaewonStamp(pos.x, pos.y);
        isDrawing = false;
        return;
      }

      ctx.beginPath();
      ctx.moveTo(pos.x, pos.y);
      draw(e);
    }

    function draw(e) {
      if (!isDrawing || currentMode === 'chawon') return;

      const pos = getPos(e);
      ctx.lineWidth = currentSize;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';

      if (currentMode === 'eraser') {
        ctx.strokeStyle = '#ffffff';
      } else {
        ctx.strokeStyle = currentColor;
      }

      ctx.lineTo(pos.x, pos.y);
      ctx.stroke();
    }

    function stopDrawing() {
      if (isDrawing) {
        ctx.closePath();
        isDrawing = false;
      }
    }

    // chaewon.png 원형 사진 도장 스탬프 구현
    function drawChaewonStamp(x, y) {
      const stampRadius = Number(currentSize) * 1.5 + 25;
      const stampDiameter = stampRadius * 2;

      ctx.save();

      // 원형 영역 마스킹
      ctx.beginPath();
      ctx.arc(x, y, stampRadius, 0, Math.PI * 2, true);
      ctx.closePath();
      ctx.clip();

      if (chaewonImg.complete && chaewonImg.naturalWidth !== 0) {
        ctx.drawImage(
          chaewonImg, 
          x - stampRadius, 
          y - stampRadius, 
          stampDiameter, 
          stampDiameter
        );
      } else {
        ctx.fillStyle = '#ff788e';
        ctx.fill();
        ctx.fillStyle = '#ffffff';
        ctx.font = `bold ${stampRadius * 0.8}px 'Gamja Flower'`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('채원', x, y);
      }

      ctx.restore();

      // 액자 테두리 그리기
      ctx.save();
      ctx.beginPath();
      ctx.arc(x, y, stampRadius, 0, Math.PI * 2);
      ctx.lineWidth = 5;
      ctx.strokeStyle = '#ff6b81';
      ctx.stroke();

      ctx.beginPath();
      ctx.arc(x, y, stampRadius + 4, 0, Math.PI * 2);
      ctx.lineWidth = 2;
      ctx.strokeStyle = '#feca57';
      ctx.setLineDash([4, 4]);
      ctx.stroke();
      ctx.restore();
    }

    function clearCanvas() {
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
    }

    function saveCanvas() {
      const link = document.createElement('a');
      link.download = '채원이의_알록달록_그림.png';
      link.href = canvas.toDataURL('image/png');
      link.click();
    }

    window.addEventListener('load', () => {
      resizeCanvas();
      createPalette();

      document.getElementById('brushSize').addEventListener('input', (e) => {
        currentSize = e.target.value;
      });

      canvas.addEventListener('mousedown', startDrawing);
      canvas.addEventListener('mousemove', draw);
      canvas.addEventListener('mouseup', stopDrawing);
      canvas.addEventListener('mouseleave', stopDrawing);

      canvas.addEventListener('touchstart', (e) => {
        e.preventDefault();
        startDrawing(e);
      });
      canvas.addEventListener('touchmove', (e) => {
        e.preventDefault();
        draw(e);
      });
      canvas.addEventListener('touchend', stopDrawing);

      window.addEventListener('resize', resizeCanvas);
    });
  </script>
</body>
</html>
